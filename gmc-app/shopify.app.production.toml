# Production app "Fixlog" (the one that goes to the Shopify App Store), served by Render.
# The dev app lives in shopify.app.toml and stays the default config, so `npm run dev` never
# touches this app's URLs. Deploy this one with:  npm run deploy -- --config production
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "af9f784b92c83ce6c1f67e7b65a570cb"
name = "Fixlog"
application_url = "https://fixlog.me"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = ""
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://fixlog.me/api/auth" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[build]
# Never point the live app at a local tunnel.
automatically_update_urls_on_dev = false
